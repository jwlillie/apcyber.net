<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINTboard CTF — Open Source Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a0e;--bg2:#090f14;--panel:#0d1620;--panel2:#111e2a;
  --border:#1a2e40;--border2:#204060;
  --cyan:#00d4ff;--cyan2:#0099cc;--cyan3:#80eaff;
  --orange:#ff8c00;--green:#00ff88;--red:#ff3355;
  --yellow:#ffe040;--blue:#4488ff;--purple:#aa44ff;
  --muted:#2a5068;--dim:#142030;--text:#90c8e0;
  --font-m:'Share Tech Mono',monospace;
  --font-d:'Inter',sans-serif;
  --font-b:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-m);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 80% 10%,rgba(0,212,255,0.05) 0%,transparent 50%),
             radial-gradient(ellipse at 10% 90%,rgba(255,140,0,0.03) 0%,transparent 50%);
  pointer-events:none;z-index:0;}
.wrapper{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px 80px;}
header{padding:44px 0 36px;border-bottom:1px solid var(--border2);}
.hdr-tag{font-size:11px;letter-spacing:4px;color:var(--muted);margin-bottom:12px;}
h1{font-family:var(--font-d);font-size:clamp(32px,6vw,68px);font-weight:700;line-height:1;color:var(--cyan3);letter-spacing:-1px;}
h1 span{color:var(--orange);}
.hdr-sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:12px;text-transform:uppercase;}
.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:28px 0;border:1px solid var(--border2);}
.sp{background:var(--panel);padding:12px 18px;border-right:1px solid var(--border2);}
.sp:last-child{border-right:none;}
.sp-l{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.sp-v{font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--yellow);}
.filter-bar{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
.fl{font-size:10px;letter-spacing:2px;color:var(--muted);margin-right:8px;}
.fbtn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--font-m);font-size:11px;letter-spacing:2px;padding:4px 14px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.fbtn:hover,.fbtn.active{border-color:var(--cyan2);color:var(--cyan3);background:rgba(0,212,255,0.06);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--border2);cursor:pointer;position:relative;overflow:hidden;animation:ri .4s ease both;transition:border-color .18s,transform .18s,box-shadow .18s;}
.card:hover{border-color:var(--cyan2);transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,212,255,0.08);}
.card.solved{border-color:var(--green);}
@keyframes ri{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.16s}.card:nth-child(5){animation-delay:.20s}.card:nth-child(6){animation-delay:.24s}.card:nth-child(7){animation-delay:.28s}.card:nth-child(8){animation-delay:.32s}.card:nth-child(9){animation-delay:.36s}.card:nth-child(10){animation-delay:.40s}
.card-stripe{height:3px;background:linear-gradient(90deg,var(--cyan),var(--orange),transparent);}
.card-body{padding:14px 16px 16px;}
.card-meta{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center;}
.card-id{font-size:10px;letter-spacing:2px;color:var(--dim);}
.card-pts{font-size:12px;color:var(--yellow);border:1px solid rgba(255,224,64,.22);padding:2px 8px;background:rgba(255,224,64,.04);}
.card-title{font-family:var(--font-d);font-size:18px;font-weight:600;color:var(--cyan3);margin-bottom:8px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:9px;letter-spacing:1px;padding:2px 7px;border:1px solid;text-transform:uppercase;}
.te{color:var(--green);border-color:rgba(0,255,136,.3);}
.tm{color:var(--yellow);border-color:rgba(255,224,64,.3);}
.th{color:var(--red);border-color:rgba(255,51,85,.3);}
.ti{color:var(--blue);border-color:rgba(68,136,255,.3);}
.card-desc{font-family:var(--font-b);font-size:12.5px;color:var(--muted);line-height:1.6;font-weight:300;margin-bottom:14px;}
.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;}
.solves{font-size:10px;color:var(--dim);}
.btn-view{background:transparent;border:1px solid var(--cyan2);color:var(--cyan3);font-size:10px;letter-spacing:2px;padding:4px 10px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.btn-view:hover{background:rgba(0,212,255,0.1);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(6,10,14,.94);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--cyan2);max-width:740px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,212,255,0.1);animation:mi .2s ease;}
@keyframes mi{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-title{font-family:var(--font-d);font-size:19px;font-weight:700;color:var(--cyan3);}
.modal-close{background:none;border:1px solid var(--border2);color:var(--muted);cursor:pointer;font-family:var(--font-m);font-size:11px;padding:3px 9px;flex-shrink:0;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{padding:20px 22px;}
.mlabel{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;margin-top:18px;}
.mlabel.first{margin-top:0;}
.mdesc{font-family:var(--font-b);font-size:13px;color:var(--text);line-height:1.75;font-weight:300;}
.hint{background:rgba(255,224,64,0.04);border:1px solid rgba(255,224,64,0.18);padding:9px 13px;font-size:11.5px;color:var(--yellow);line-height:1.6;margin-bottom:7px;}
.hint::before{content:'// HINT ' attr(data-n) ': ';color:var(--dim);}
.flag-box{background:rgba(0,255,136,0.04);border:1px solid rgba(0,255,136,0.25);padding:11px 15px;font-size:13px;color:var(--green);letter-spacing:1px;}
.sol{background:rgba(0,212,255,0.03);border:1px solid rgba(0,212,255,0.12);padding:12px 15px;font-size:11.5px;color:var(--text);line-height:1.7;}
/* WIDGET */
.widget{background:#04090e;border:1px solid var(--border2);margin-top:12px;padding:14px;}
.wlabel{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.wlabel.mt{margin-top:12px;}
.wcode{background:#000;border:1px solid var(--border);padding:10px 12px;font-size:11px;color:var(--text);line-height:1.7;overflow-x:auto;white-space:pre;}
.winput{width:100%;background:#04090e;border:1px solid var(--border);color:var(--cyan3);font-family:var(--font-m);font-size:12px;padding:7px 10px;outline:none;transition:border-color .15s;}
.winput:focus{border-color:var(--cyan2);}
.wrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.wbtn{background:rgba(0,212,255,0.07);border:1px solid var(--cyan2);color:var(--cyan3);font-family:var(--font-m);font-size:11px;letter-spacing:1px;padding:6px 13px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.wbtn:hover{background:rgba(0,212,255,0.16);}
.wbtn.g{border-color:var(--green);color:var(--green);background:rgba(0,255,136,0.05);}
.wbtn.g:hover{background:rgba(0,255,136,0.13);}
.wbtn.o{border-color:var(--orange);color:var(--orange);background:rgba(255,140,0,0.05);}
.wbtn.o:hover{background:rgba(255,140,0,0.13);}
.wbtn.r{border-color:var(--red);color:var(--red);background:rgba(255,51,85,0.05);}
.wbtn.y{border-color:var(--yellow);color:var(--yellow);background:rgba(255,224,64,0.05);}
.wout{padding:10px 12px;font-size:12px;line-height:1.7;display:none;border-top:1px solid var(--border);color:var(--text);white-space:pre-wrap;}
.wout.show{display:block;}
.wout.ok{color:var(--green);}
.wout.err{color:var(--red);}
/* RESULT CARD */
.rcard{background:var(--panel2);border:1px solid var(--border2);padding:10px 14px;margin-top:6px;font-size:11.5px;line-height:1.7;}
.rcard .rkey{color:var(--cyan);min-width:130px;display:inline-block;}
.rcard .rval{color:var(--text);}
.rcard .rhigh{color:var(--orange);}
.rcard .rok{color:var(--green);}
.rcard .rred{color:var(--red);}
/* TIMELINE */
.tl-item{display:flex;gap:12px;margin-bottom:8px;align-items:flex-start;}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan2);flex-shrink:0;margin-top:4px;}
.tl-dot.red{background:var(--red);}
.tl-dot.orange{background:var(--orange);}
.tl-line{border-left:1px solid var(--border2);padding-left:12px;flex:1;}
.tl-date{font-size:10px;color:var(--muted);}
.tl-text{font-size:11.5px;color:var(--text);}
/* MAP PLACEHOLDER */
.map-box{background:#000;border:1px solid var(--border);height:180px;position:relative;overflow:hidden;margin-top:8px;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.05) 1px,transparent 1px);background-size:30px 30px;}
.map-pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);transition:all .4s;}
.map-label{position:absolute;font-size:9px;color:var(--cyan3);background:rgba(0,0,0,.7);padding:2px 5px;border:1px solid var(--cyan2);white-space:nowrap;}
/* PROGRESS */
.prog-bar{height:4px;background:var(--border);margin:8px 0;display:none;}
.prog-fill{height:100%;background:var(--cyan);transition:width .08s;width:0;}
.prog-txt{font-size:11px;color:var(--muted);}
/* COMMIT LOG */
.commit{padding:8px 10px;border-bottom:1px solid var(--border);font-size:11px;cursor:pointer;transition:background .12s;}
.commit:hover{background:var(--panel2);}
.commit .chash{color:var(--orange);margin-right:8px;}
.commit .cmsg{color:var(--text);}
.commit .cdate{color:var(--muted);font-size:10px;float:right;}
.commit .cauthor{color:var(--cyan);margin-left:8px;}
</style>
</head>
<body>
<div class="wrapper">
<header>
<div style="background:#050810;border-bottom:1px solid #1a2640;padding:.4rem 1.5rem;font-family:'Share Tech Mono',monospace;font-size:11px"><a href="ctf.html" style="font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(0,240,255,0.45);text-decoration:none;letter-spacing:2px;margin-right:1.5rem;transition:color .2s" onmouseover="this.style.color='#00f0ff'" onmouseout="this.style.color='rgba(0,240,255,0.45)'">&#8592; CTF HUB</a></div>
  <div class="hdr-tag">// OSINTBOARD CTF — OPEN SOURCE INTELLIGENCE</div>
  <h1>OSINT<span>board</span></h1>
  <div class="hdr-sub">WHOIS · DNS · WAYBACK · GEOINT · CERTLOG · GIT · SHODAN · BREACH · SOCMINT · PASTE</div>
</header>
<div class="scoreboard">
  <div class="sp"><div class="sp-l">Challenges</div><div class="sp-v" id="sc-total">0</div></div>
  <div class="sp"><div class="sp-l">Total Points</div><div class="sp-v" id="sc-pts">0</div></div>
  <div class="sp"><div class="sp-l">Solved</div><div class="sp-v" id="sc-solved">0</div></div>
  <div class="sp"><div class="sp-l">Points Earned</div><div class="sp-v" id="sc-earned">0</div></div>
</div>
<div class="filter-bar">
  <span class="fl">FILTER:</span>
  <button class="fbtn active" onclick="filterCards('all',this)">ALL</button>
  <button class="fbtn" onclick="filterCards('easy',this)">EASY</button>
  <button class="fbtn" onclick="filterCards('medium',this)">MEDIUM</button>
  <button class="fbtn" onclick="filterCards('hard',this)">HARD</button>
</div>
<div class="grid" id="grid"></div>
</div>

<div class="modal-overlay" id="overlay" onclick="closeModal(event)">
<div class="modal">
  <div class="modal-hdr">
    <div class="modal-title" id="m-title"></div>
    <button class="modal-close" onclick="closeModal()">[ X ] CLOSE</button>
  </div>
  <div class="modal-body" id="m-body"></div>
</div>
</div>

<script>
var challenges=[
{id:'CH-01',title:'WHOIS Lookup',pts:50,diff:'easy',tags:['whois','domain','registrar'],solves:341,
 desc:'A suspicious domain "flag-exfil.net" was found in threat intel. Run a WHOIS lookup to identify the registrant\'s name, organisation, and the hidden flag embedded in the abuse contact email address.',
 hints:['WHOIS records often contain Registrant Email and Abuse Contact fields','Look carefully at all contact email addresses — one contains the flag'],
 flag:'CTF{wh01s_r3g1str4nt_3xp0s3d}',
 sol:'whois flag-exfil.net → Abuse Contact Email: CTF{wh01s_r3g1str4nt_3xp0s3d}@abuse.flag-exfil.net. The flag is the local part of the email.',
 widget:'whois'},
{id:'CH-02',title:'DNS Enumeration',pts:100,diff:'easy',tags:['dns','subdomain','txt'],solves:267,
 desc:'The domain "ctf-target.io" has a TXT record containing a base64-encoded flag. Enumerate DNS records (A, MX, TXT, NS, CNAME) to find and decode it.',
 hints:['dig TXT ctf-target.io will query TXT records','TXT records can hold arbitrary text — base64 is common for verification tokens'],
 flag:'CTF{dns_txt_r3c0rd_3xf1ltr4t3d}',
 sol:'dig TXT ctf-target.io +short → "v=flag1 Q1RGe2Ruc190eHRfcjNjMHJkXzN4ZjFsdHI0dDNkfQ==" → base64 decode → flag.',
 widget:'dns'},
{id:'CH-03',title:'Wayback Machine',pts:100,diff:'easy',tags:['wayback','archive','web'],solves:224,
 desc:'A company\'s website "acmecorp.example" had its /secret-admin/ page indexed by the Wayback Machine before it was taken down. Find the archived snapshot and extract the flag from the old page.',
 hints:['https://web.archive.org/web/*/acmecorp.example/secret-admin/','Look for snapshots from 2019–2021'],
 flag:'CTF{w4yb4ck_4rch1v3d_s3cr3t_p4g3}',
 sol:'Archive.org snapshot from 2020-11-14 shows /secret-admin/index.html with flag in a hidden <div> element.',
 widget:'wayback'},
{id:'CH-04',title:'Reverse Image Geolocation',pts:150,diff:'medium',tags:['geoint','imagery','location'],solves:178,
 desc:'A photo was posted anonymously on social media. Identify the exact location using visual clues: street signs, building architecture, shop names, and landmark geometry visible in the image.',
 hints:['Look for street name signs, utility markings, or distinctive architecture','Google Street View and maps.google.com let you explore candidate locations'],
 flag:'CTF{g301nt_str33t_1d_p1nk_c0rn3r}',
 sol:'The pink corner building, "Carrer de Blai" sign, and Barcelona Gothic Quarter architecture confirm location: 41.3784° N, 2.1686° E.',
 widget:'geoint'},
{id:'CH-05',title:'Certificate Transparency',pts:150,diff:'medium',tags:['certs','ct-log','subdomain'],solves:152,
 desc:'Using certificate transparency logs, enumerate all subdomains of "megacorp-ctf.com" that have ever had a TLS certificate issued. One subdomain reveals a staging server with the flag.',
 hints:['crt.sh?q=%.megacorp-ctf.com lists all issued certificates','Look for unusual subdomain names like staging, dev, internal, or secret'],
 flag:'CTF{ct_l0g_subd0m41n_3num3r4t3d}',
 sol:'crt.sh finds: secret-staging.megacorp-ctf.com issued 2023-08-12. Visiting it returns HTTP 200 with the flag in the page body.',
 widget:'certs'},
{id:'CH-06',title:'Git History Leak',pts:200,diff:'medium',tags:['git','github','secrets'],solves:119,
 desc:'A developer accidentally committed an API key and flag to a public GitHub repo, then deleted the file. The commit still exists in git history. Find the deleted file and recover its contents.',
 hints:['git log --all --full-history shows all commits including "deleted" files','git show <hash>:path/to/file retrieves content from any commit'],
 flag:'CTF{g1t_h1st0ry_s3cr3t_3xp0s3d}',
 sol:'git log --all --oneline shows commit a3f9b2c "remove secrets". git show a3f9b2c:config/secrets.env → API_KEY + flag.',
 widget:'git'},
{id:'CH-07',title:'Shodan Recon',pts:200,diff:'medium',tags:['shodan','iot','banner'],solves:98,
 desc:'A vulnerable industrial control system is exposed on the internet. Search Shodan for the device running a specific SCADA banner string. The flag is embedded in its HTTP response header.',
 hints:['Shodan query: "SCADA-Server" port:8080 country:US','Look at the raw HTTP response headers of the matching host'],
 flag:'CTF{sh0d4n_sc4d4_3xp0s3d_b4nn3r}',
 sol:'Shodan finds 192.0.2.47:8080 running SCADA-Server/2.1. HTTP response header X-Flag: CTF{sh0d4n_sc4d4_3xp0s3d_b4nn3r}.',
 widget:'shodan'},
{id:'CH-08',title:'Breach Data Search',pts:250,diff:'hard',tags:['hibp','breach','credentials'],solves:74,
 desc:'An email address "target@victim-corp.com" appeared in a data breach. Identify which breach it was part of, what data was exposed, and find the flag hidden in the breach description metadata.',
 hints:['haveibeenpwned.com/api/v3/breachedaccount/{email}','Look at the Description field of the breach — it may contain extra data'],
 flag:'CTF{br34ch_d4t4_3xp0s3d_p4ssw0rd}',
 sol:'HIBP API returns breach "VictimCorpDB2021". The Description field contains: "...flag: CTF{br34ch_d4t4_3xp0s3d_p4ssw0rd}...".',
 widget:'breach'},
{id:'CH-09',title:'Social Footprint',pts:300,diff:'hard',tags:['socmint','username','pivot'],solves:51,
 desc:'Starting from only a username "x3r0_c00l", pivot across platforms to build a social footprint. The target used the same username on GitHub, Twitter, and a forum. The flag is in their GitHub bio.',
 hints:['Sherlock, Maigret, and WhatsMyName enumerate usernames across 300+ sites','Check the bio, README, and pinned gists on any GitHub profile found'],
 flag:'CTF{s0c1al_f00tpr1nt_p1v0t_ch41n}',
 sol:'sherlock x3r0_c00l finds github.com/x3r0_c00l. Profile bio: "CTF{s0c1al_f00tpr1nt_p1v0t_ch41n}". Also cross-referenced on HackForums.',
 widget:'social'},
{id:'CH-10',title:'Pastebin Hunter',pts:350,diff:'hard',tags:['pastebin','dork','google'],solves:37,
 desc:'Sensitive credentials were accidentally pasted to Pastebin and indexed by Google. Use Google dorks to find the paste, which contains a leaked database password and the flag.',
 hints:['Google dork: site:pastebin.com "victim-corp.com" "password"','Try multiple paste sites: pastebin.com, rentry.co, hastebin.com'],
 flag:'CTF{p4st3b1n_d0rk_cr3d3nt14l_l34k}',
 sol:'Google: site:pastebin.com "victim-corp.com" "DB_PASS" → pastebin.com/xK7mP3qZ → contains DB_USER, DB_PASS, and the flag.',
 widget:'paste'}
];

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
var solved={};var earned=0;

function filterCards(diff,btn){
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');
  document.querySelectorAll('.card').forEach(function(c){c.style.display=(diff==='all'||c.dataset.diff===diff)?'':'none';});
}

function openModal(idx){
  var ch=challenges[idx];
  var h='<div class="mlabel first">DESCRIPTION</div><div class="mdesc">'+esc(ch.desc)+'</div>';
  h+='<div class="mlabel">HINTS</div>';
  ch.hints.forEach(function(hi,i){h+='<div class="hint" data-n="'+(i+1)+'">'+esc(hi)+'</div>';});
  h+='<div class="mlabel">LIVE CHALLENGE</div>'+buildWidget(ch.widget);
  h+='<div class="mlabel">FLAG</div><div class="flag-box">'+esc(ch.flag)+'</div>';
  h+='<div class="mlabel">SOLUTION</div><div class="sol">'+esc(ch.sol)+'</div>';
  document.getElementById('m-title').textContent=ch.id+' — '+ch.title;
  document.getElementById('m-body').innerHTML=h;
  document.getElementById('overlay').classList.add('open');
  if(!solved[idx]){solved[idx]=true;earned+=ch.pts;
    document.getElementById('sc-solved').textContent=Object.keys(solved).length;
    document.getElementById('sc-earned').textContent=earned;
    document.querySelector('[data-idx="'+idx+'"]').classList.add('solved');
  }
}

function closeModal(e){if(!e||e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');}

// ── WIDGET BUILDERS ──────────────────────────────────────────

function buildWidget(w){
  var h='<div class="widget">';

  // CH-01: WHOIS
  if(w==='whois'){
    h+='<div class="wlabel">TARGET DOMAIN</div>';
    h+='<input class="winput" id="whois-q" placeholder="Enter domain e.g. flag-exfil.net" value="flag-exfil.net">';
    h+='<div class="wrow"><button class="wbtn" onclick="whoisLookup()">Run WHOIS lookup</button><button class="wbtn g" onclick="whoisFlag()">Show abuse contact field</button></div>';
    h+='<div class="wout" id="whois-r"></div>';
  }

  // CH-02: DNS
  else if(w==='dns'){

// CH-04 Geolocation
function geoGuess(){
  var lat=parseFloat(document.getElementById('geo-lat').value);
  var lng=parseFloat(document.getElementById('geo-lng').value);
  var r=document.getElementById('geo-r');
  if(isNaN(lat)||isNaN(lng)){r.className='wout err show';r.textContent='Enter valid coordinates.';return;}
  var dist=Math.sqrt(Math.pow(lat-41.3784,2)+Math.pow(lng-2.1686,2));
  var pin=document.getElementById('geo-pin');var lbl=document.getElementById('geo-lbl');
  pin.style.display='block';pin.style.left=Math.min(90,Math.max(5,(lng+10)*18))+'%';pin.style.top=Math.min(90,Math.max(5,(60-lat)*4))+'%';
  lbl.style.display='block';lbl.style.left=pin.style.left;lbl.style.top='calc('+pin.style.top+' + 14px)';
  lbl.textContent=lat.toFixed(4)+'°N '+lng.toFixed(4)+'°E';
  if(dist<0.05){r.className='wout ok show';r.textContent='✓ Correct! Within '+Math.round(dist*111000)+'m of target.\nLocation: Carrer de Blai, El Raval, Barcelona, Spain\nFlag: CTF{g301nt_str33t_1d_p1nk_c0rn3r}';}
  else{r.className='wout show';r.textContent='Distance: ~'+Math.round(dist*111000)+'m from target.\nLook for: Barcelona, Gothic Quarter / El Raval area.';}
}
function geoReveal(){
  document.getElementById('geo-lat').value='41.3784';
  document.getElementById('geo-lng').value='2.1686';
  geoGuess();
}

// CH-09 Social Footprint
function socSearch(){
  var q=document.getElementById('soc-q').value.trim()||'x3r0_c00l';
  var bar=document.getElementById('soc-bar');var fill=document.getElementById('soc-fill');
  var txt=document.getElementById('soc-txt');var r=document.getElementById('soc-r1');
  bar.style.display='block';
  var sites=['Twitter','Instagram','Reddit','GitHub','HackForums','LinkedIn','TikTok','Steam','Twitch','Pastebin','Discord','Telegram','Medium','DeviantArt','Flickr'];
  var found=['GitHub','HackForums','Reddit'];
  var p=0;var i=0;r.className='wout show';r.textContent='';
  var t=setInterval(function(){
    if(i<sites.length){
      p=Math.round((i+1)/sites.length*100);fill.style.width=p+'%';
      var hit=found.indexOf(sites[i])>=0;
      txt.textContent='Checking: '+sites[i]+'...';
      r.textContent+=(hit?'[+] FOUND  ':'[-] not found  ')+sites[i]+(hit?' → https://'+sites[i].toLowerCase()+'.com/'+q:'')+(hit&&sites[i]==='GitHub'?' ← CHECK THIS!':'')+'\n';
      i++;
    }else{
      clearInterval(t);txt.textContent='Scan complete — '+found.length+' profiles found.';
      document.getElementById('soc-row2').style.display='block';
    }
  },120);
}

window.addEventListener('DOMContentLoaded',function(){
  var total=0;challenges.forEach(function(c){total+=c.pts;});
  document.getElementById('sc-total').textContent=challenges.length;
  document.getElementById('sc-pts').textContent=total;
  var g=document.getElementById('grid');
  challenges.forEach(function(ch,idx){
    var dTag=ch.diff==='easy'?'<span class="tag te">EASY</span>':ch.diff==='medium'?'<span class="tag tm">MEDIUM</span>':'<span class="tag th">HARD</span>';
    var tTags=ch.tags.map(function(t){return '<span class="tag ti">'+esc(t)+'</span>';}).join('');
    var c=document.createElement('div');c.className='card';c.dataset.diff=ch.diff;c.dataset.idx=idx;
    c.innerHTML='<div class="card-stripe"></div><div class="card-body">'
      +'<div class="card-meta"><span class="card-id">'+esc(ch.id)+'</span><span class="card-pts">'+ch.pts+' pts</span></div>'
      +'<div class="card-title">'+esc(ch.title)+'</div>'
      +'<div class="card-tags">'+dTag+tTags+'</div>'
      +'<div class="card-desc">'+esc(ch.desc.substring(0,100))+'...</div>'
      +'<div class="card-footer"><span class="solves">'+ch.solves+' solves</span><button class="btn-view">OPEN &gt;&gt;</button></div></div>';
    c.addEventListener('click',function(){openModal(idx);});
    g.appendChild(c);
  });
});
